<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>증명서 발급 시스템</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', sans-serif; background: #f5f5f5; color: #2d2d2d; min-height: 100vh; }

        .header { background: white; padding: 20px 48px; border-bottom: 2px solid #4a9b7f; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.03em; }
        .header .sub-info { font-size: 12px; color: #aaa; font-weight: 300; margin-top: 4px; }
        .back-btn { background: transparent; border: 1px solid #ddd; color: #888; padding: 7px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 500; text-decoration: none; transition: all 0.2s; }
        .back-btn:hover { border-color: #bbb; color: #555; }

        .container { max-width: 960px; margin: 0 auto; padding: 48px 24px; }
        .page-title { text-align: center; margin-bottom: 12px; font-size: 24px; font-weight: 700; letter-spacing: -0.03em; }
        .page-desc { text-align: center; font-size: 14px; color: #999; font-weight: 300; margin-bottom: 48px; }

        .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }

        .card {
            background: white; border-radius: 16px; padding: 32px 28px; border: 1px solid #eee;
            text-decoration: none; color: inherit; transition: all 0.25s; cursor: pointer;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .card:hover { border-color: #4a9b7f; box-shadow: 0 8px 24px rgba(74,155,127,0.1); transform: translateY(-2px); }

        .card-icon {
            width: 64px; height: 64px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; margin-bottom: 20px;
        }
        .card-icon.green { background: #eef7f3; }
        .card-icon.blue { background: #eef3f9; }
        .card-icon.orange { background: #fdf5ee; }

        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.02em; }
        .card p { font-size: 13px; color: #999; font-weight: 300; line-height: 1.6; }
        .card .badge {
            margin-top: 16px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 500;
        }
        .badge.active { background: #eef7f3; color: #3d8269; }
        .badge.soon { background: #f5f5f5; color: #bbb; }

        @media (max-width: 700px) {
            .card-grid { grid-template-columns: 1fr; }
            .header { padding: 16px 20px; }
            .container { padding: 32px 16px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <h1>증명서 발급 시스템</h1>
        <div class="sub-info">재직증명서 · 경력증명서 · 퇴직증명서</div>
    </div>
    <div>
        <a href="../index.html" class="back-btn">&larr; 업무일지로 돌아가기</a>
    </div>
</div>

<div class="container">
    <div class="page-title">증명서 종류 선택</div>
    <div class="page-desc">발급할 증명서 종류를 선택해주세요</div>

    <div class="card-grid">
        <a class="card" href="../certificate.html?type=재직증명서">
            <div class="card-icon green">&#x1f4cb;</div>
            <h3>재직증명서</h3>
            <p>현재 재직 중인 직원의<br>재직 사실을 증명합니다</p>
            <span class="badge active">발급 가능</span>
        </a>

        <a class="card" href="../certificate.html?type=경력증명서">
            <div class="card-icon blue">&#x1f4c4;</div>
            <h3>경력증명서</h3>
            <p>직원의 근무 경력 및<br>업무 이력을 증명합니다</p>
            <span class="badge active">발급 가능</span>
        </a>

        <a class="card" href="../certificate.html?type=퇴직증명서">
            <div class="card-icon orange">&#x1f4e4;</div>
            <h3>퇴직증명서</h3>
            <p>퇴직한 직원의<br>퇴직 사실을 증명합니다</p>
            <span class="badge active">발급 가능</span>
        </a>
    </div>
</div>

</body>
</html>
